<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联觉打字体验 - Synesthesia Typing Experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'SimHei', Arial, sans-serif;
            overflow: hidden;
            background: #000;
            cursor: default;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #0a0a1f 0%, #000000 100%);
        }

        #text-display {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.95);
            font-size: 2.5rem;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
            max-width: 80vw;
            word-wrap: break-word;
            line-height: 1.6;
            transition: all 0.2s ease;
            white-space: pre-wrap;
        }

        /* 欢迎屏幕 */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #1a1a3f 0%, #000000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
            transition: opacity 0.5s ease;
        }

        #welcome-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #welcome-screen h1 {
            font-size: 3rem;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #667eea, #764ba2, #f093fb, #4facfe);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 3s ease infinite;
        }

        #welcome-screen .subtitle {
            font-size: 1.1rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        #welcome-screen .demo-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #start-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 30px rgba(102, 126, 234, 0.5);
        }

        #start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 40px rgba(102, 126, 234, 0.7);
        }

        .demo-btn {
            padding: 10px 20px;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .demo-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* 底部工具栏 - 简洁设计 */
        #toolbar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 25px;
            border-radius: 50px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        #toolbar.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .tool-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .tool-btn.primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border-color: transparent;
        }

        .tool-btn.primary:hover {
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.5);
        }

        /* 设置面板 */
        #settings-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(20, 20, 40, 0.95);
            padding: 30px;
            border-radius: 20px;
            z-index: 200;
            color: white;
            min-width: 350px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        #settings-panel.visible {
            opacity: 1;
            pointer-events: all;
            transform: translate(-50%, -50%) scale(1);
        }

        #settings-panel h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .setting-group {
            margin-bottom: 20px;
        }

        .setting-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .mode-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .mode-btn {
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .mode-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .mode-btn.active {
            background: rgba(102, 126, 234, 0.3);
            border-color: rgba(102, 126, 234, 0.8);
        }

        .mode-btn .icon {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .mode-btn .name {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .toggle-btn {
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-right: 10px;
        }

        .toggle-btn.active {
            background: rgba(100, 200, 100, 0.3);
            border-color: rgba(100, 200, 100, 0.8);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* 提示信息 */
        .hint {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 0.9rem;
            z-index: 150;
            opacity: 0;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .hint.visible {
            opacity: 1;
        }

        @media (max-width: 768px) {
            #text-display {
                font-size: 1.8rem;
                max-width: 85vw;
            }

            #welcome-screen h1 {
                font-size: 2rem;
            }

            #toolbar {
                flex-wrap: wrap;
                padding: 12px 20px;
                bottom: 20px;
            }

            .tool-btn {
                padding: 8px 15px;
                font-size: 0.85rem;
            }

            #settings-panel {
                min-width: 90vw;
                padding: 25px;
            }

            .mode-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <!-- 欢迎屏幕 -->
    <div id="welcome-screen">
        <h1>✨ 联觉打字体验 ✨</h1>
        <p class="subtitle">让每个字符都成为视听交响</p>
        <button id="start-btn">开始创作</button>
        <div class="demo-buttons">
            <button class="demo-btn" data-demo="诗意">🌸 诗意演示</button>
            <button class="demo-btn" data-demo="哲理">💭 哲理演示</button>
            <button class="demo-btn" data-demo="创意">🎨 创意演示</button>
        </div>
    </div>

    <!-- 文字显示区域 -->
    <div id="text-display"></div>

    <!-- 底部工具栏 -->
    <div id="toolbar" class="hidden">
        <button class="tool-btn" id="demo-btn">✨ 看看效果</button>
        <button class="tool-btn" id="clear-btn">🗑️ 清除</button>
        <button class="tool-btn" id="copy-btn">📋 复制</button>
        <button class="tool-btn" id="settings-btn">⚙️ 设置</button>
    </div>

    <!-- 设置面板 -->
    <div id="settings-panel">
        <button class="close-btn">×</button>
        <h2>设置</h2>

        <div class="setting-group">
            <label>视觉模式</label>
            <div class="mode-options">
                <div class="mode-btn active" data-mode="burst">
                    <div class="icon">💥</div>
                    <div class="name">爆发</div>
                </div>
                <div class="mode-btn" data-mode="wave">
                    <div class="icon">🌊</div>
                    <div class="name">波浪</div>
                </div>
                <div class="mode-btn" data-mode="spiral">
                    <div class="icon">🌀</div>
                    <div class="name">螺旋</div>
                </div>
                <div class="mode-btn" data-mode="constellation">
                    <div class="icon">✨</div>
                    <div class="name">星座</div>
                </div>
            </div>
        </div>

        <div class="setting-group">
            <label>效果开关</label>
            <button class="toggle-btn active" id="particles-toggle">粒子效果</button>
            <button class="toggle-btn active" id="sound-toggle">音效</button>
        </div>

        <div class="setting-group">
            <button class="tool-btn primary" id="fullscreen-btn" style="width: 100%;">进入全屏</button>
        </div>
    </div>

    <!-- 提示信息 -->
    <div class="hint" id="hint"></div>

    <script>
        // 预设演示文案
        const DEMO_TEXTS = {
            '诗意': '春江潮水连海平，海上明月共潮生',
            '哲理': '生活不是等待暴风雨过去，而是学会在雨中起舞',
            '创意': 'Stay Hungry Stay Foolish'
        };

        class SynesthesiaTyping {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.textDisplay = document.getElementById('text-display');

                this.text = '';
                this.particles = [];
                this.ripples = [];
                this.stars = [];
                this.audioContext = null;
                this.analyser = null;
                this.dataArray = null;
                this.particlesEnabled = true;
                this.soundEnabled = true;
                this.visualMode = 'burst';
                this.isAutoPlaying = false;

                this.initStars();
                this.resize();
                this.setupEventListeners();
                this.animate();
            }

            initStars() {
                for (let i = 0; i < 100; i++) {
                    this.stars.push({
                        x: Math.random() * window.innerWidth,
                        y: Math.random() * window.innerHeight,
                        size: Math.random() * 2,
                        speed: Math.random() * 0.5 + 0.1,
                        opacity: Math.random() * 0.5 + 0.3
                    });
                }
            }

            setupEventListeners() {
                window.addEventListener('resize', () => this.resize());

                // 键盘事件
                document.addEventListener('keydown', (e) => {
                    if (this.isAutoPlaying) return;

                    if (e.key === 'Escape') {
                        this.clearText();
                    } else if (e.key === 'Enter') {
                        this.addCharacter('\n');
                    } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
                        this.addCharacter(e.key);
                    } else if (e.key === 'Backspace') {
                        this.removeCharacter();
                    }
                });

                // 欢迎屏幕
                document.getElementById('start-btn').addEventListener('click', () => {
                    this.start();
                });

                // 演示按钮
                document.querySelectorAll('.demo-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const demo = btn.dataset.demo;
                        this.start();
                        setTimeout(() => this.playDemo(demo), 300);
                    });
                });

                // 工具栏按钮
                document.getElementById('demo-btn').addEventListener('click', () => {
                    this.playDemo('创意');
                });

                document.getElementById('clear-btn').addEventListener('click', () => {
                    this.clearText();
                });

                document.getElementById('copy-btn').addEventListener('click', () => {
                    this.copyText();
                });

                document.getElementById('settings-btn').addEventListener('click', () => {
                    document.getElementById('settings-panel').classList.toggle('visible');
                });

                // 设置面板
                document.querySelector('.close-btn').addEventListener('click', () => {
                    document.getElementById('settings-panel').classList.remove('visible');
                });

                // 模式选择
                document.querySelectorAll('.mode-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.visualMode = btn.dataset.mode;
                        this.showHint(`已切换到 ${btn.querySelector('.name').textContent} 模式`);
                        // 立即演示效果
                        this.previewMode(btn.dataset.mode);
                    });
                });

                // 开关切换
                document.getElementById('particles-toggle').addEventListener('click', (e) => {
                    this.particlesEnabled = !this.particlesEnabled;
                    e.target.classList.toggle('active');
                });

                document.getElementById('sound-toggle').addEventListener('click', (e) => {
                    this.soundEnabled = !this.soundEnabled;
                    e.target.classList.toggle('active');
                    if (this.soundEnabled && !this.audioContext) {
                        this.initAudio();
                    }
                });

                document.getElementById('fullscreen-btn').addEventListener('click', () => {
                    this.toggleFullscreen();
                });
            }

            start() {
                this.initAudio();
                document.getElementById('welcome-screen').classList.add('hidden');
                document.getElementById('toolbar').classList.remove('hidden');
                this.showHint('开始打字，创造你的视听交响 ✨', 3000);
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                this.centerX = this.canvas.width / 2;
                this.centerY = this.canvas.height / 2;
            }

            initAudio() {
                if (!this.audioContext) {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    this.analyser = this.audioContext.createAnalyser();
                    this.analyser.fftSize = 256;
                    this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                }
            }

            addCharacter(char) {
                this.text += char;
                this.textDisplay.textContent = this.text;

                const charCode = char.charCodeAt(0);
                const hue = (charCode * 7) % 360;

                this.createRipple(hue);

                if (this.particlesEnabled) {
                    this.createParticles(hue, charCode);
                }

                if (this.soundEnabled && this.audioContext && char !== '\n') {
                    this.playSound(charCode);
                }

                // 文字动画
                this.textDisplay.style.transform = 'translate(-50%, -50%) scale(1.05)';
                this.textDisplay.style.color = `hsl(${hue}, 85%, 75%)`;
                this.textDisplay.style.textShadow = `0 0 40px hsl(${hue}, 85%, 65%)`;
                setTimeout(() => {
                    this.textDisplay.style.transform = 'translate(-50%, -50%) scale(1)';
                }, 150);
            }

            removeCharacter() {
                if (this.text.length > 0) {
                    this.text = this.text.slice(0, -1);
                    this.textDisplay.textContent = this.text;
                }
            }

            createRipple(hue) {
                this.ripples.push({
                    x: this.centerX,
                    y: this.centerY,
                    radius: 0,
                    maxRadius: 300 + Math.random() * 200,
                    color: `hsl(${hue}, 75%, 65%)`,
                    alpha: 1
                });
            }

            createParticles(hue, charCode) {
                const particleCount = 20 + (charCode % 30);

                switch(this.visualMode) {
                    case 'burst':
                        this.createBurstParticles(hue, particleCount);
                        break;
                    case 'wave':
                        this.createWaveParticles(hue, particleCount);
                        break;
                    case 'spiral':
                        this.createSpiralParticles(hue, particleCount);
                        break;
                    case 'constellation':
                        this.createConstellationParticles(hue, particleCount);
                        break;
                }
            }

            createBurstParticles(hue, count) {
                for (let i = 0; i < count; i++) {
                    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
                    const speed = 2 + Math.random() * 4;
                    const size = 2 + Math.random() * 4;

                    this.particles.push({
                        x: this.centerX,
                        y: this.centerY,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        size: size,
                        color: `hsl(${hue + Math.random() * 30}, 80%, 60%)`,
                        life: 1,
                        decay: 0.01 + Math.random() * 0.01
                    });
                }
            }

            createWaveParticles(hue, count) {
                const time = Date.now() * 0.001;
                for (let i = 0; i < count; i++) {
                    const angle = (Math.PI * 2 * i) / count;
                    const radius = 50 + Math.sin(time + i * 0.5) * 30;
                    const speed = 1 + Math.random() * 2;

                    this.particles.push({
                        x: this.centerX + Math.cos(angle) * radius,
                        y: this.centerY + Math.sin(angle) * radius,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        size: 3 + Math.random() * 3,
                        color: `hsl(${hue + (i * 10) % 60}, 70%, 60%)`,
                        life: 1,
                        decay: 0.008
                    });
                }
            }

            createSpiralParticles(hue, count) {
                for (let i = 0; i < count; i++) {
                    const angle = (Math.PI * 2 * i) / count;
                    const spiralAngle = i * 0.3;
                    const radius = i * 2;

                    this.particles.push({
                        x: this.centerX + Math.cos(spiralAngle) * radius,
                        y: this.centerY + Math.sin(spiralAngle) * radius,
                        vx: Math.cos(angle) * 2,
                        vy: Math.sin(angle) * 2,
                        size: 2 + Math.random() * 3,
                        color: `hsl(${(hue + i * 5) % 360}, 75%, 65%)`,
                        life: 1,
                        decay: 0.01
                    });
                }
            }

            createConstellationParticles(hue, count) {
                const positions = [];
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const distance = 50 + Math.random() * 150;
                    const x = this.centerX + Math.cos(angle) * distance;
                    const y = this.centerY + Math.sin(angle) * distance;

                    positions.push({x, y});

                    this.particles.push({
                        x: x,
                        y: y,
                        vx: (Math.random() - 0.5) * 2,
                        vy: (Math.random() - 0.5) * 2,
                        size: 3 + Math.random() * 2,
                        color: `hsl(${hue}, 80%, 70%)`,
                        life: 1,
                        decay: 0.008,
                        isConstellation: true,
                        connections: positions.length > 1 ? [positions[positions.length - 2]] : []
                    });
                }
            }

            playSound(charCode) {
                if (!this.audioContext) return;

                const baseFreq = 200;
                const octave = (charCode % 4) + 3;
                const noteIndex = charCode % 12;

                const notes = [0, 2, 4, 5, 7, 9, 11, 12, 14, 16, 17, 19];
                const semitone = notes[noteIndex];
                const frequency = baseFreq * Math.pow(2, (octave - 4 + semitone / 12));

                const oscillator = this.audioContext.createOscillator();
                const gainNode = this.audioContext.createGain();

                const waveforms = ['sine', 'triangle', 'square', 'sawtooth'];
                oscillator.type = waveforms[charCode % waveforms.length];
                oscillator.frequency.setValueAtTime(frequency, this.audioContext.currentTime);

                const now = this.audioContext.currentTime;
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.2, now + 0.01);
                gainNode.gain.linearRampToValueAtTime(0.15, now + 0.05);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.25);

                oscillator.connect(gainNode);
                gainNode.connect(this.analyser);
                gainNode.connect(this.audioContext.destination);

                oscillator.start(now);
                oscillator.stop(now + 0.25);
            }

            clearText() {
                this.text = '';
                this.textDisplay.textContent = '';
                this.textDisplay.style.color = 'rgba(255, 255, 255, 0.95)';
                this.showHint('已清除', 1500);
            }

            copyText() {
                if (!this.text) {
                    this.showHint('没有内容可复制', 2000);
                    return;
                }

                navigator.clipboard.writeText(this.text).then(() => {
                    this.showHint('已复制到剪贴板 ✓', 2000);
                }).catch(() => {
                    this.showHint('复制失败', 2000);
                });
            }

            showHint(message, duration = 2000) {
                const hint = document.getElementById('hint');
                hint.textContent = message;
                hint.classList.add('visible');
                setTimeout(() => {
                    hint.classList.remove('visible');
                }, duration);
            }

            toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                    this.showHint('已进入全屏', 2000);
                } else {
                    document.exitFullscreen();
                    this.showHint('已退出全屏', 2000);
                }
            }

            // 自动演示
            async playDemo(type) {
                if (this.isAutoPlaying) return;

                this.clearText();
                this.isAutoPlaying = true;

                const text = DEMO_TEXTS[type] || DEMO_TEXTS['创意'];

                for (let i = 0; i < text.length; i++) {
                    if (!this.isAutoPlaying) break;
                    this.addCharacter(text[i]);
                    await this.sleep(150);
                }

                this.isAutoPlaying = false;
            }

            // 模式预览
            previewMode(mode) {
                const tempMode = this.visualMode;
                this.visualMode = mode;

                // 触发几个示范粒子
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => {
                        const hue = Math.random() * 360;
                        this.createRipple(hue);
                        this.createParticles(hue, 65 + i * 10);
                    }, i * 200);
                }

                this.visualMode = tempMode;
            }

            sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            // 更新和绘制
            updateRipples() {
                for (let i = this.ripples.length - 1; i >= 0; i--) {
                    const r = this.ripples[i];
                    r.radius += 5;
                    r.alpha -= 0.01;

                    if (r.alpha <= 0 || r.radius >= r.maxRadius) {
                        this.ripples.splice(i, 1);
                    }
                }
            }

            drawRipples() {
                for (const r of this.ripples) {
                    this.ctx.save();
                    this.ctx.globalAlpha = r.alpha;
                    this.ctx.strokeStyle = r.color;
                    this.ctx.lineWidth = 2;
                    this.ctx.beginPath();
                    this.ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                    this.ctx.stroke();

                    this.ctx.globalAlpha = r.alpha * 0.5;
                    this.ctx.lineWidth = 4;
                    this.ctx.beginPath();
                    this.ctx.arc(r.x, r.y, r.radius - 10, 0, Math.PI * 2);
                    this.ctx.stroke();

                    this.ctx.restore();
                }
            }

            updateStars() {
                for (const star of this.stars) {
                    star.y += star.speed;
                    if (star.y > this.canvas.height) {
                        star.y = 0;
                        star.x = Math.random() * this.canvas.width;
                    }

                    star.opacity += (Math.random() - 0.5) * 0.1;
                    star.opacity = Math.max(0.1, Math.min(0.8, star.opacity));
                }
            }

            drawStars() {
                for (const star of this.stars) {
                    this.ctx.save();
                    this.ctx.globalAlpha = star.opacity;
                    this.ctx.fillStyle = 'white';
                    this.ctx.beginPath();
                    this.ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.restore();
                }
            }

            updateParticles() {
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];

                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.05;
                    p.vx *= 0.99;
                    p.vy *= 0.99;
                    p.life -= p.decay;

                    if (p.life <= 0) {
                        this.particles.splice(i, 1);
                    }
                }
            }

            drawParticles() {
                for (const p of this.particles) {
                    this.ctx.save();
                    this.ctx.globalAlpha = p.life;

                    this.ctx.fillStyle = p.color;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fill();

                    const gradient = this.ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 3);
                    gradient.addColorStop(0, p.color);
                    gradient.addColorStop(1, 'transparent');
                    this.ctx.fillStyle = gradient;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size * 3, 0, Math.PI * 2);
                    this.ctx.fill();

                    if (p.isConstellation && p.connections) {
                        this.ctx.strokeStyle = p.color;
                        this.ctx.lineWidth = 1;
                        for (const conn of p.connections) {
                            this.ctx.beginPath();
                            this.ctx.moveTo(p.x, p.y);
                            this.ctx.lineTo(conn.x, conn.y);
                            this.ctx.stroke();
                        }
                    }

                    this.ctx.restore();
                }
            }

            drawAudioVisualization() {
                if (!this.analyser || !this.dataArray) return;

                this.analyser.getByteFrequencyData(this.dataArray);

                const barWidth = this.canvas.width / this.dataArray.length;
                const centerY = this.canvas.height / 2;

                for (let i = 0; i < this.dataArray.length; i++) {
                    const value = this.dataArray[i];
                    const height = (value / 255) * 100;
                    const x = i * barWidth;
                    const hue = (i / this.dataArray.length) * 360;

                    this.ctx.save();
                    this.ctx.globalAlpha = 0.3;
                    this.ctx.fillStyle = `hsl(${hue}, 70%, 60%)`;

                    this.ctx.fillRect(x, centerY - height, barWidth - 1, height);
                    this.ctx.fillRect(x, centerY, barWidth - 1, height);

                    this.ctx.restore();
                }
            }

            animate() {
                this.ctx.fillStyle = 'rgba(10, 10, 31, 0.15)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.updateStars();
                this.drawStars();

                this.drawAudioVisualization();

                this.updateRipples();
                this.drawRipples();

                this.updateParticles();
                this.drawParticles();

                requestAnimationFrame(() => this.animate());
            }
        }

        // 初始化应用
        window.addEventListener('DOMContentLoaded', () => {
            new SynesthesiaTyping();
        });
    </script>
</body>
</html>
