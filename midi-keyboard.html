<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDI 电子琴</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: linear-gradient(-45deg, #667eea, #764ba2, #f093fb, #4facfe, #43e97b);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3),
                        0 0 0 1px rgba(255, 255, 255, 0.2) inset;
            max-width: 1000px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }

        h1 {
            text-align: center;
            background: linear-gradient(135deg, #fff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
            font-size: 2.8em;
            font-weight: 700;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
        }

        .controls {
            display: flex;
            justify-content: space-around;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .control-group:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .control-group label {
            font-weight: 600;
            color: #fff;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .control-group button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
        }

        .control-group button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .control-group button:hover::before {
            width: 300px;
            height: 300px;
        }

        .control-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        .control-group button:active {
            transform: translateY(0) scale(0.95);
        }

        #octave-display {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            min-width: 40px;
            text-align: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 8px 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        #timbre {
            padding: 10px 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            font-weight: 600;
            transition: all 0.3s ease;
        }

        #timbre:hover {
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        #decay {
            width: 150px;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #decay::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.6);
            transition: all 0.3s ease;
        }

        #decay::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.8);
        }

        #decay::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.6);
        }

        #decay-display {
            font-size: 16px;
            color: #fff;
            font-weight: 700;
            min-width: 50px;
            display: inline-block;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .keyboard {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            position: relative;
            height: 250px;
            margin: 40px 0;
            padding: 0 20px;
        }

        .key {
            position: relative;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            transform-style: preserve-3d;
        }

        .key.white {
            width: 60px;
            height: 200px;
            background: linear-gradient(to bottom, #ffffff 0%, #f5f5f5 50%, #e8e8e8 100%);
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-radius: 0 0 8px 8px;
            margin: 0 2px;
            z-index: 1;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2),
                        inset 0 -5px 10px rgba(0, 0, 0, 0.05),
                        inset 0 2px 5px rgba(255, 255, 255, 0.8);
        }

        .key.black {
            width: 40px;
            height: 130px;
            background: linear-gradient(to bottom, #3a3a3a 0%, #1a1a1a 50%, #000000 100%);
            border: 2px solid #000;
            border-radius: 0 0 5px 5px;
            position: absolute;
            z-index: 2;
            margin: 0;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5),
                        inset 0 -3px 8px rgba(0, 0, 0, 0.4),
                        inset 0 1px 2px rgba(255, 255, 255, 0.1);
        }

        /* 定位黑键 */
        .key.black:nth-of-type(2) { left: 62px; }  /* W - C# */
        .key.black:nth-of-type(4) { left: 126px; } /* E - D# */
        .key.black:nth-of-type(7) { left: 254px; } /* T - F# */
        .key.black:nth-of-type(9) { left: 318px; } /* Y - G# */
        .key.black:nth-of-type(11) { left: 382px; } /* U - A# */

        .key-label {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            line-height: 1.3;
        }

        .key.white .key-label {
            color: #333;
        }

        .key.black .key-label {
            color: #fff;
            bottom: 8px;
            font-size: 10px;
        }

        .key.white:hover {
            background: linear-gradient(to bottom, #fafafa 0%, #f0f0f0 50%, #e5e5e5 100%);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25),
                        inset 0 -5px 10px rgba(0, 0, 0, 0.05),
                        inset 0 2px 5px rgba(255, 255, 255, 0.9);
        }

        .key.black:hover {
            background: linear-gradient(to bottom, #4a4a4a 0%, #2a2a2a 50%, #0a0a0a 100%);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6),
                        inset 0 -3px 8px rgba(0, 0, 0, 0.4),
                        inset 0 1px 2px rgba(255, 255, 255, 0.15);
        }

        .key.active {
            transform: translateY(5px) translateZ(-10px);
        }

        .key.white.active {
            background: linear-gradient(to bottom, #e8e8e8 0%, #d8d8d8 50%, #c8c8c8 100%);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15),
                        inset 0 3px 8px rgba(0, 0, 0, 0.2);
        }

        .key.black.active {
            background: linear-gradient(to bottom, #2a2a2a 0%, #1a1a1a 50%, #000000 100%);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4),
                        inset 0 3px 10px rgba(0, 0, 0, 0.6);
        }

        /* 彩色发光效果 */
        @keyframes glow {
            0% {
                filter: drop-shadow(0 0 5px var(--glow-color))
                        drop-shadow(0 0 15px var(--glow-color))
                        drop-shadow(0 0 25px var(--glow-color));
            }
            50% {
                filter: drop-shadow(0 0 10px var(--glow-color))
                        drop-shadow(0 0 30px var(--glow-color))
                        drop-shadow(0 0 50px var(--glow-color))
                        drop-shadow(0 0 70px var(--glow-color));
            }
            100% {
                filter: drop-shadow(0 0 5px var(--glow-color))
                        drop-shadow(0 0 15px var(--glow-color))
                        drop-shadow(0 0 25px var(--glow-color));
            }
        }

        .key.glowing {
            animation: glow 0.6s ease-in-out infinite;
            position: relative;
        }

        .key.glowing::after {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            background: var(--glow-color);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--glow-color),
                        0 0 40px var(--glow-color),
                        0 0 60px var(--glow-color);
            animation: particleRise 1s ease-out forwards;
        }

        @keyframes particleRise {
            0% {
                top: -10px;
                opacity: 1;
                transform: translateX(-50%) scale(1);
            }
            100% {
                top: -80px;
                opacity: 0;
                transform: translateX(-50%) scale(0.3);
            }
        }

        .instructions {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 20px;
            margin-top: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            z-index: 1;
        }

        .instructions h3 {
            background: linear-gradient(135deg, #fff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            font-size: 1.5em;
            font-weight: 600;
        }

        .instructions p {
            color: rgba(255, 255, 255, 0.95);
            margin: 10px 0;
            line-height: 1.8;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .instructions strong {
            color: #fff;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* 预设曲目面板 */
        .presets {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 20px;
            margin-top: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            z-index: 1;
        }

        .presets h3 {
            background: linear-gradient(135deg, #fff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            font-size: 1.3em;
            font-weight: 600;
        }

        .preset-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .preset-btn {
            background: linear-gradient(135deg, #43e97b, #38f9d7);
            color: #333;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(67, 233, 123, 0.4);
            position: relative;
            overflow: hidden;
        }

        .preset-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .preset-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .preset-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(67, 233, 123, 0.6);
        }

        .preset-btn:active {
            transform: translateY(0) scale(0.95);
        }

        .preset-btn.playing {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 5px 15px rgba(240, 147, 251, 0.4);
            }
            50% {
                box-shadow: 0 8px 25px rgba(240, 147, 251, 0.8);
            }
        }

        .stop-btn {
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
            transition: all 0.3s ease;
            display: none;
        }

        .stop-btn.visible {
            display: inline-block;
        }

        .stop-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.6);
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .keyboard {
                height: 180px;
                transform: scale(0.8);
            }

            .key.white {
                width: 45px;
                height: 150px;
            }

            .key.black {
                width: 30px;
                height: 100px;
            }

            .key.black:nth-of-type(2) { left: 47px; }
            .key.black:nth-of-type(4) { left: 95px; }
            .key.black:nth-of-type(7) { left: 191px; }
            .key.black:nth-of-type(9) { left: 239px; }
            .key.black:nth-of-type(11) { left: 287px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MIDI 电子琴</h1>

        <div class="controls">
            <div class="control-group">
                <label for="octave">八度:</label>
                <button id="octave-down">-</button>
                <span id="octave-display">4</span>
                <button id="octave-up">+</button>
            </div>

            <div class="control-group">
                <label for="timbre">音色:</label>
                <select id="timbre">
                    <option value="sine">正弦波 (柔和)</option>
                    <option value="square">方波 (明亮)</option>
                    <option value="sawtooth">锯齿波 (丰富)</option>
                    <option value="guitar">古典吉他</option>
                    <option value="piano">古典钢琴</option>
                </select>
            </div>

            <div class="control-group">
                <label for="decay">声音衰减:</label>
                <input type="range" id="decay" min="0.05" max="2.0" step="0.05" value="0.3">
                <span id="decay-display">0.3s</span>
            </div>
        </div>

        <div class="keyboard">
            <!-- 白键 -->
            <div class="key white" data-note="C" data-key="A">
                <span class="key-label">A<br>C</span>
            </div>
            <div class="key black" data-note="C#" data-key="W">
                <span class="key-label">W<br>C#</span>
            </div>
            <div class="key white" data-note="D" data-key="S">
                <span class="key-label">S<br>D</span>
            </div>
            <div class="key black" data-note="D#" data-key="E">
                <span class="key-label">E<br>D#</span>
            </div>
            <div class="key white" data-note="E" data-key="D">
                <span class="key-label">D<br>E</span>
            </div>
            <div class="key white" data-note="F" data-key="F">
                <span class="key-label">F<br>F</span>
            </div>
            <div class="key black" data-note="F#" data-key="T">
                <span class="key-label">T<br>F#</span>
            </div>
            <div class="key white" data-note="G" data-key="G">
                <span class="key-label">G<br>G</span>
            </div>
            <div class="key black" data-note="G#" data-key="Y">
                <span class="key-label">Y<br>G#</span>
            </div>
            <div class="key white" data-note="A" data-key="H">
                <span class="key-label">H<br>A</span>
            </div>
            <div class="key black" data-note="A#" data-key="U">
                <span class="key-label">U<br>A#</span>
            </div>
            <div class="key white" data-note="B" data-key="J">
                <span class="key-label">J<br>B</span>
            </div>
        </div>

        <div class="presets">
            <h3>🎵 预设曲目</h3>
            <div class="preset-buttons">
                <button class="preset-btn" data-song="twinkle">⭐ 小星星</button>
                <button class="preset-btn" data-song="auld">🎊 友谊地久天长</button>
                <button class="preset-btn" data-song="indians">👶 十个小印第安人</button>
                <button class="stop-btn" id="stop-song">⏹ 停止</button>
            </div>
        </div>

        <div class="instructions">
            <h3>使用说明:</h3>
            <p><strong>白键:</strong> A S D F G H J (对应 C D E F G A B)</p>
            <p><strong>黑键:</strong> W E T Y U (对应 C# D# F# G# A#)</p>
            <p><strong>八度切换:</strong> 使用 + / - 按钮或鼠标点击</p>
            <p><strong>音色:</strong> 从下拉菜单选择不同的音色（包括古典吉他和古典钢琴）</p>
            <p><strong>声音衰减:</strong> 调节滑块控制音符消失的时长 (0.05s - 2.0s)</p>
            <p><strong>彩色发光:</strong> 按下按键时会显示彩色发光效果，每个音符有不同颜色</p>
        </div>
    </div>

    <script>
        // MIDI 电子琴应用
        class MIDIKeyboard {
            constructor() {
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                this.currentOctave = 4;
                this.currentTimbre = 'sine';
                this.releaseTime = 0.3;
                this.activeOscillators = new Map();
                this.keyPressed = new Set();
                this.isPlaying = false;
                this.playbackTimeouts = [];

                // 音符到频率的映射 (A4 = 440Hz)
                this.noteFrequencies = {
                    'C': 261.63,
                    'C#': 277.18,
                    'D': 293.66,
                    'D#': 311.13,
                    'E': 329.63,
                    'F': 349.23,
                    'F#': 369.99,
                    'G': 392.00,
                    'G#': 415.30,
                    'A': 440.00,
                    'A#': 466.16,
                    'B': 493.88
                };

                // 键盘按键到音符的映射
                this.keyMap = {
                    'A': 'C',
                    'W': 'C#',
                    'S': 'D',
                    'E': 'D#',
                    'D': 'E',
                    'F': 'F',
                    'T': 'F#',
                    'G': 'G',
                    'Y': 'G#',
                    'H': 'A',
                    'U': 'A#',
                    'J': 'B'
                };

                // 每个按键的发光颜色
                this.keyColors = {
                    'C': '#ff0000',   // 红色
                    'C#': '#ff8800',  // 橙色
                    'D': '#ffff00',   // 黄色
                    'D#': '#88ff00',  // 黄绿色
                    'E': '#00ff00',   // 绿色
                    'F': '#00ff88',   // 青绿色
                    'F#': '#00ffff',  // 青色
                    'G': '#0088ff',   // 天蓝色
                    'G#': '#0000ff',  // 蓝色
                    'A': '#8800ff',   // 紫色
                    'A#': '#ff00ff',  // 品红色
                    'B': '#ff0088'    // 玫红色
                };

                // 预设歌曲 (音符, 时长ms)
                this.songs = {
                    twinkle: [
                        // 小星星 - Twinkle Twinkle Little Star
                        ['C', 500], ['C', 500], ['G', 500], ['G', 500],
                        ['A', 500], ['A', 500], ['G', 1000],
                        ['F', 500], ['F', 500], ['E', 500], ['E', 500],
                        ['D', 500], ['D', 500], ['C', 1000],

                        ['G', 500], ['G', 500], ['F', 500], ['F', 500],
                        ['E', 500], ['E', 500], ['D', 1000],
                        ['G', 500], ['G', 500], ['F', 500], ['F', 500],
                        ['E', 500], ['E', 500], ['D', 1000],

                        ['C', 500], ['C', 500], ['G', 500], ['G', 500],
                        ['A', 500], ['A', 500], ['G', 1000],
                        ['F', 500], ['F', 500], ['E', 500], ['E', 500],
                        ['D', 500], ['D', 500], ['C', 1000]
                    ],
                    auld: [
                        // 友谊地久天长 - Auld Lang Syne
                        ['C', 400], ['C', 200], ['C', 400], ['E', 400],
                        ['D', 400], ['C', 400], ['E', 800],
                        ['D', 400], ['C', 400], ['E', 400], ['G', 1200],

                        ['C', 400], ['C', 200], ['C', 400], ['E', 400],
                        ['D', 400], ['C', 400], ['A', 400], ['G', 400],
                        ['E', 400], ['D', 400], ['C', 1200],

                        ['E', 400], ['E', 400], ['G', 400], ['E', 400],
                        ['D', 400], ['C', 400], ['E', 800],
                        ['D', 400], ['C', 400], ['E', 400], ['D', 1200],

                        ['C', 400], ['C', 200], ['C', 400], ['E', 400],
                        ['D', 400], ['C', 400], ['A', 400], ['G', 400],
                        ['E', 400], ['D', 400], ['C', 1200]
                    ],
                    indians: [
                        // 十个小印第安人 - Ten Little Indians
                        ['C', 400], ['D', 400], ['E', 400], ['F', 400],
                        ['G', 400], ['G', 400], ['G', 800],
                        ['F', 400], ['F', 400], ['E', 400], ['E', 400],
                        ['D', 400], ['D', 400], ['C', 800],

                        ['C', 400], ['D', 400], ['E', 400], ['F', 400],
                        ['G', 400], ['G', 400], ['G', 800],
                        ['F', 400], ['F', 400], ['E', 400], ['E', 400],
                        ['D', 400], ['D', 400], ['C', 800],

                        ['G', 400], ['G', 400], ['A', 400], ['A', 400],
                        ['G', 400], ['G', 400], ['E', 800],
                        ['F', 400], ['F', 400], ['E', 400], ['E', 400],
                        ['D', 400], ['D', 400], ['C', 800]
                    ]
                };

                this.init();
            }

            init() {
                this.setupEventListeners();
                this.updateOctaveDisplay();
            }

            setupEventListeners() {
                // 八度控制
                document.getElementById('octave-up').addEventListener('click', () => this.changeOctave(1));
                document.getElementById('octave-down').addEventListener('click', () => this.changeOctave(-1));

                // 音色选择
                document.getElementById('timbre').addEventListener('change', (e) => {
                    this.currentTimbre = e.target.value;
                });

                // 声音衰减控制
                document.getElementById('decay').addEventListener('input', (e) => {
                    this.releaseTime = parseFloat(e.target.value);
                    document.getElementById('decay-display').textContent = this.releaseTime.toFixed(2) + 's';
                });

                // 键盘事件
                document.addEventListener('keydown', (e) => this.handleKeyDown(e));
                document.addEventListener('keyup', (e) => this.handleKeyUp(e));

                // 鼠标点击钢琴键
                document.querySelectorAll('.key').forEach(key => {
                    key.addEventListener('mousedown', () => {
                        const note = key.dataset.note;
                        const color = this.keyColors[note];
                        this.playNote(note);
                        key.classList.add('active', 'glowing');
                        key.style.setProperty('--glow-color', color);
                    });

                    key.addEventListener('mouseup', () => {
                        const note = key.dataset.note;
                        this.stopNote(note);
                        key.classList.remove('active', 'glowing');
                    });

                    key.addEventListener('mouseleave', () => {
                        const note = key.dataset.note;
                        this.stopNote(note);
                        key.classList.remove('active', 'glowing');
                    });
                });

                // 预设曲目按钮
                document.querySelectorAll('.preset-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const songName = e.target.dataset.song;
                        this.playSong(songName, e.target);
                    });
                });

                // 停止按钮
                document.getElementById('stop-song').addEventListener('click', () => {
                    this.stopSong();
                });
            }

            changeOctave(direction) {
                this.currentOctave = Math.max(0, Math.min(8, this.currentOctave + direction));
                this.updateOctaveDisplay();
            }

            updateOctaveDisplay() {
                document.getElementById('octave-display').textContent = this.currentOctave;
            }

            handleKeyDown(e) {
                const key = e.key.toUpperCase();

                // 防止重复按键
                if (this.keyPressed.has(key)) {
                    return;
                }

                if (this.keyMap[key]) {
                    e.preventDefault();
                    this.keyPressed.add(key);
                    const note = this.keyMap[key];
                    this.playNote(note);
                    this.highlightKey(key, true);
                }
            }

            handleKeyUp(e) {
                const key = e.key.toUpperCase();

                if (this.keyMap[key]) {
                    e.preventDefault();
                    this.keyPressed.delete(key);
                    const note = this.keyMap[key];
                    this.stopNote(note);
                    this.highlightKey(key, false);
                }
            }

            highlightKey(key, active) {
                const keyElement = document.querySelector(`[data-key="${key}"]`);
                if (keyElement) {
                    const note = this.keyMap[key];
                    const color = this.keyColors[note];

                    if (active) {
                        keyElement.classList.add('active', 'glowing');
                        keyElement.style.setProperty('--glow-color', color);
                    } else {
                        keyElement.classList.remove('active', 'glowing');
                    }
                }
            }

            getFrequency(note) {
                const baseFrequency = this.noteFrequencies[note];
                // 计算当前八度的频率
                const octaveMultiplier = Math.pow(2, this.currentOctave - 4);
                return baseFrequency * octaveMultiplier;
            }

            playNote(note) {
                // 如果该音符已经在播放，先停止
                if (this.activeOscillators.has(note)) {
                    this.stopNote(note);
                }

                const frequency = this.getFrequency(note);
                const now = this.audioContext.currentTime;

                if (this.currentTimbre === 'guitar') {
                    this.playGuitar(note, frequency, now);
                } else if (this.currentTimbre === 'piano') {
                    this.playPiano(note, frequency, now);
                } else {
                    this.playSimpleWave(note, frequency, now);
                }
            }

            playSimpleWave(note, frequency, now) {
                // 创建振荡器
                const oscillator = this.audioContext.createOscillator();
                const gainNode = this.audioContext.createGain();

                oscillator.type = this.currentTimbre;
                oscillator.frequency.setValueAtTime(frequency, now);

                // 设置音量包络 (ADSR)
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.3, now + 0.01); // Attack
                gainNode.gain.linearRampToValueAtTime(0.2, now + 0.1);  // Decay to Sustain

                // 连接音频节点
                oscillator.connect(gainNode);
                gainNode.connect(this.audioContext.destination);

                // 开始播放
                oscillator.start(now);

                // 保存振荡器和增益节点的引用
                this.activeOscillators.set(note, { oscillators: [oscillator], gainNode });
            }

            playGuitar(note, frequency, now) {
                // 古典吉他音色：使用多个谐波和滤波器
                const gainNode = this.audioContext.createGain();
                const filter = this.audioContext.createBiquadFilter();

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(2000, now);
                filter.Q.setValueAtTime(1, now);

                // 创建多个谐波
                const oscillators = [];
                const harmonics = [
                    { freq: 1, gain: 0.4 },
                    { freq: 2, gain: 0.2 },
                    { freq: 3, gain: 0.15 },
                    { freq: 4, gain: 0.1 },
                    { freq: 5, gain: 0.05 }
                ];

                harmonics.forEach(harmonic => {
                    const osc = this.audioContext.createOscillator();
                    const oscGain = this.audioContext.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(frequency * harmonic.freq, now);
                    oscGain.gain.setValueAtTime(harmonic.gain, now);

                    osc.connect(oscGain);
                    oscGain.connect(filter);

                    osc.start(now);
                    oscillators.push(osc);
                });

                // 吉他的音量包络：快速的Attack和较长的Decay
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.5, now + 0.005); // 快速Attack
                gainNode.gain.exponentialRampToValueAtTime(0.3, now + 0.1); // Decay

                filter.connect(gainNode);
                gainNode.connect(this.audioContext.destination);

                this.activeOscillators.set(note, { oscillators, gainNode, filter });
            }

            playPiano(note, frequency, now) {
                // 古典钢琴音色：使用多个谐波和复杂的包络
                const gainNode = this.audioContext.createGain();
                const filter = this.audioContext.createBiquadFilter();

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(3000, now);
                filter.Q.setValueAtTime(0.5, now);

                // 钢琴的谐波结构
                const oscillators = [];
                const harmonics = [
                    { freq: 1, gain: 0.5, detune: 0 },
                    { freq: 2, gain: 0.3, detune: 1 },
                    { freq: 3, gain: 0.15, detune: -1 },
                    { freq: 4, gain: 0.1, detune: 0.5 },
                    { freq: 5, gain: 0.05, detune: -0.5 },
                    { freq: 6, gain: 0.03, detune: 0 }
                ];

                harmonics.forEach(harmonic => {
                    const osc = this.audioContext.createOscillator();
                    const oscGain = this.audioContext.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(frequency * harmonic.freq, now);
                    osc.detune.setValueAtTime(harmonic.detune, now);
                    oscGain.gain.setValueAtTime(harmonic.gain, now);

                    osc.connect(oscGain);
                    oscGain.connect(filter);

                    osc.start(now);
                    oscillators.push(osc);
                });

                // 钢琴的音量包络：快速Attack和明显的Decay
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.6, now + 0.003); // 非常快的Attack
                gainNode.gain.exponentialRampToValueAtTime(0.4, now + 0.05); // 快速Decay
                gainNode.gain.exponentialRampToValueAtTime(0.25, now + 0.2); // 持续Decay

                filter.connect(gainNode);
                gainNode.connect(this.audioContext.destination);

                this.activeOscillators.set(note, { oscillators, gainNode, filter });
            }

            stopNote(note) {
                if (!this.activeOscillators.has(note)) {
                    return;
                }

                const { oscillators, gainNode } = this.activeOscillators.get(note);
                const now = this.audioContext.currentTime;

                // 释放音符 (Release) - 使用可控制的衰减时间
                gainNode.gain.cancelScheduledValues(now);
                gainNode.gain.setValueAtTime(gainNode.gain.value, now);
                gainNode.gain.linearRampToValueAtTime(0, now + this.releaseTime);

                // 停止所有振荡器
                oscillators.forEach(osc => {
                    osc.stop(now + this.releaseTime);
                });

                // 从活动振荡器中移除
                this.activeOscillators.delete(note);
            }

            playSong(songName, buttonElement) {
                // 如果已经在播放，先停止
                if (this.isPlaying) {
                    this.stopSong();
                }

                const song = this.songs[songName];
                if (!song) return;

                this.isPlaying = true;

                // 更新UI
                document.querySelectorAll('.preset-btn').forEach(btn => {
                    btn.classList.remove('playing');
                });
                buttonElement.classList.add('playing');
                document.getElementById('stop-song').classList.add('visible');

                // 播放歌曲
                let currentTime = 0;
                song.forEach(([note, duration]) => {
                    // 播放音符
                    const playTimeout = setTimeout(() => {
                        this.playNote(note);
                        this.highlightNoteVisual(note, true);
                    }, currentTime);
                    this.playbackTimeouts.push(playTimeout);

                    // 停止音符
                    const stopTimeout = setTimeout(() => {
                        this.stopNote(note);
                        this.highlightNoteVisual(note, false);
                    }, currentTime + duration * 0.8); // 稍微提前停止，音符之间有间隙
                    this.playbackTimeouts.push(stopTimeout);

                    currentTime += duration;
                });

                // 歌曲结束后清理
                const endTimeout = setTimeout(() => {
                    this.stopSong();
                }, currentTime);
                this.playbackTimeouts.push(endTimeout);
            }

            stopSong() {
                // 清除所有定时器
                this.playbackTimeouts.forEach(timeout => clearTimeout(timeout));
                this.playbackTimeouts = [];

                // 停止所有正在播放的音符
                for (const note of this.activeOscillators.keys()) {
                    this.stopNote(note);
                }

                // 清除所有高亮
                document.querySelectorAll('.key').forEach(key => {
                    key.classList.remove('active', 'glowing');
                });

                // 重置状态
                this.isPlaying = false;

                // 更新UI
                document.querySelectorAll('.preset-btn').forEach(btn => {
                    btn.classList.remove('playing');
                });
                document.getElementById('stop-song').classList.remove('visible');
            }

            highlightNoteVisual(note, active) {
                const keyElement = document.querySelector(`[data-note="${note}"]`);
                if (keyElement) {
                    const color = this.keyColors[note];

                    if (active) {
                        keyElement.classList.add('active', 'glowing');
                        keyElement.style.setProperty('--glow-color', color);
                    } else {
                        keyElement.classList.remove('active', 'glowing');
                    }
                }
            }
        }

        // 初始化应用
        let keyboard;

        // 等待用户交互后初始化音频上下文（浏览器安全策略要求）
        document.addEventListener('DOMContentLoaded', () => {
            keyboard = new MIDIKeyboard();

            // 提示用户点击以启用音频
            const notice = document.createElement('div');
            notice.style.cssText = `
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: #667eea;
                color: white;
                padding: 15px 30px;
                border-radius: 10px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.3);
                z-index: 1000;
                font-weight: bold;
            `;
            notice.textContent = '点击任意位置或按键开始演奏！';
            document.body.appendChild(notice);

            const enableAudio = () => {
                if (keyboard.audioContext.state === 'suspended') {
                    keyboard.audioContext.resume();
                }
                notice.remove();
                document.removeEventListener('click', enableAudio);
                document.removeEventListener('keydown', enableAudio);
            };

            document.addEventListener('click', enableAudio, { once: true });
            document.addEventListener('keydown', enableAudio, { once: true });
        });
    </script>
</body>
</html>
