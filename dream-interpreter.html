<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✨ 梦境解读 - Dream Interpreter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      line-height: 1.6;
      font-weight: 400;

      --color-primary: #9d4edd;
      --color-secondary: #5a189a;
      --color-accent: #ff006e;
      --color-light: #f3e8ff;
      --color-dark: #240046;
      --color-text: #2b2d42;
      --color-text-light: #8d99ae;

      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg,
        #667eea 0%,
        #764ba2 25%,
        #f093fb 50%,
        #4facfe 75%,
        #00f2fe 100%
      );
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      overflow-x: hidden;
    }

    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
      animation: floatParticles 20s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes floatParticles {
      0%, 100% {
        transform: translateY(0) scale(1);
        opacity: 0.3;
      }
      50% {
        transform: translateY(-20px) scale(1.1);
        opacity: 0.6;
      }
    }

    #root {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2rem 1rem;
    }

    .app {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .app-header {
      text-align: center;
      margin-bottom: 3rem;
      animation: fadeInDown 0.8s ease;
    }

    .app-title {
      font-size: 3.5rem;
      font-weight: 700;
      color: white;
      margin-bottom: 0.5rem;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
      letter-spacing: -0.02em;
    }

    .app-subtitle {
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 300;
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.1);
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 2.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1),
                  0 2px 8px rgba(0, 0, 0, 0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: fadeInUp 0.6s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.15),
                  0 4px 12px rgba(0, 0, 0, 0.08);
    }

    .dream-form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-label {
      font-size: 1rem;
      font-weight: 600;
      color: var(--color-secondary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .form-input,
    .form-textarea {
      padding: 1rem 1.25rem;
      border: 2px solid rgba(157, 78, 221, 0.2);
      border-radius: 16px;
      font-size: 1rem;
      font-family: inherit;
      background: white;
      color: var(--color-text);
      transition: all 0.3s ease;
      outline: none;
    }

    .form-input:focus,
    .form-textarea:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 4px rgba(157, 78, 221, 0.1);
    }

    .form-textarea {
      min-height: 150px;
      resize: vertical;
      line-height: 1.6;
    }

    .form-button {
      padding: 1rem 2rem;
      border: none;
      border-radius: 16px;
      font-size: 1.1rem;
      font-weight: 600;
      font-family: inherit;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 16px rgba(102, 126, 234, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .form-button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(102, 126, 234, 0.5);
    }

    .form-button:active:not(:disabled) {
      transform: translateY(0);
    }

    .form-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .dreams-container {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .dreams-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .dreams-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--color-secondary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .dreams-count {
      font-size: 0.9rem;
      color: var(--color-text-light);
      background: rgba(157, 78, 221, 0.1);
      padding: 0.25rem 0.75rem;
      border-radius: 12px;
    }

    .dream-item {
      background: linear-gradient(135deg,
        rgba(157, 78, 221, 0.05) 0%,
        rgba(102, 126, 234, 0.05) 100%);
      border-radius: 16px;
      padding: 1.5rem;
      transition: all 0.3s ease;
      border: 1px solid rgba(157, 78, 221, 0.1);
      cursor: pointer;
    }

    .dream-item:hover {
      background: linear-gradient(135deg,
        rgba(157, 78, 221, 0.1) 0%,
        rgba(102, 126, 234, 0.1) 100%);
      border-color: rgba(157, 78, 221, 0.3);
      transform: translateX(4px);
    }

    .dream-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }

    .dream-title-text {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--color-secondary);
      margin-bottom: 0.25rem;
    }

    .dream-date {
      font-size: 0.85rem;
      color: var(--color-text-light);
    }

    .dream-actions {
      display: flex;
      gap: 0.5rem;
    }

    .icon-button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.2rem;
      padding: 0.5rem;
      border-radius: 8px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-button:hover {
      background: rgba(157, 78, 221, 0.1);
    }

    .icon-button.delete:hover {
      background: rgba(255, 0, 110, 0.1);
      color: var(--color-accent);
    }

    .dream-content {
      color: var(--color-text);
      line-height: 1.6;
      margin-bottom: 1rem;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .dream-content.expanded {
      display: block;
      -webkit-line-clamp: unset;
    }

    .dream-interpretation {
      margin-top: 1rem;
      padding: 1.25rem;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 12px;
      border-left: 4px solid var(--color-primary);
    }

    .interpretation-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--color-secondary);
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .interpretation-content {
      color: var(--color-text);
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .loading-spinner {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border: 2px solid rgba(157, 78, 221, 0.3);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--color-text-light);
    }

    .empty-state-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      opacity: 0.3;
    }

    .empty-state-text {
      font-size: 1.1rem;
    }

    .api-key-hint {
      font-size: 0.85rem;
      color: var(--color-text-light);
      margin-top: 0.5rem;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .app-title {
        font-size: 2.5rem;
      }

      .card {
        padding: 1.5rem;
      }

      .dreams-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [dreams, setDreams] = useState([]);
      const [dreamTitle, setDreamTitle] = useState('');
      const [dreamContent, setDreamContent] = useState('');
      const [apiKey, setApiKey] = useState('');
      const [expandedDream, setExpandedDream] = useState(null);
      const [interpretingDream, setInterpretingDream] = useState(null);

      useEffect(() => {
        const savedDreams = localStorage.getItem('dreams');
        const savedApiKey = localStorage.getItem('anthropicApiKey');

        if (savedDreams) {
          try {
            setDreams(JSON.parse(savedDreams));
          } catch (e) {
            console.error('Failed to load dreams:', e);
          }
        }

        if (savedApiKey) {
          setApiKey(savedApiKey);
        }
      }, []);

      useEffect(() => {
        if (dreams.length > 0) {
          localStorage.setItem('dreams', JSON.stringify(dreams));
        }
      }, [dreams]);

      useEffect(() => {
        if (apiKey) {
          localStorage.setItem('anthropicApiKey', apiKey);
        }
      }, [apiKey]);

      const handleSubmit = async (e) => {
        e.preventDefault();

        if (!dreamTitle.trim() || !dreamContent.trim()) {
          alert('请填写梦境标题和内容');
          return;
        }

        const newDream = {
          id: Date.now(),
          title: dreamTitle.trim(),
          content: dreamContent.trim(),
          date: new Date().toISOString(),
          interpretation: null
        };

        setDreams([newDream, ...dreams]);
        setDreamTitle('');
        setDreamContent('');

        if (apiKey) {
          await interpretDream(newDream.id, newDream.content);
        }
      };

      const interpretDream = async (dreamId, content) => {
        if (!apiKey) {
          alert('请先设置 Anthropic API Key');
          return;
        }

        setInterpretingDream(dreamId);

        try {
          const response = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-api-key': apiKey,
              'anthropic-version': '2023-06-01'
            },
            body: JSON.stringify({
              model: 'claude-3-5-sonnet-20241022',
              max_tokens: 1024,
              messages: [{
                role: 'user',
                content: `作为一位温柔、富有同理心的解梦专家，请帮我解读这个梦境。请用温暖、平静的语气，提供深入而有洞察力的分析。

梦境内容：
${content}

请从以下几个角度进行解读：
1. 梦境的整体象征意义
2. 可能反映的情绪状态
3. 与现实生活的潜在联系
4. 积极的启示和建议

请用中文回复，语气要温柔、充满关怀。`
              }]
            })
          });

          if (!response.ok) {
            throw new Error(`API 请求失败: ${response.status}`);
          }

          const data = await response.json();
          const interpretation = data.content[0].text;

          setDreams(prevDreams =>
            prevDreams.map(dream =>
              dream.id === dreamId
                ? { ...dream, interpretation }
                : dream
            )
          );
        } catch (error) {
          console.error('Failed to interpret dream:', error);
          alert('解梦失败: ' + (error.message || '未知错误'));
        } finally {
          setInterpretingDream(null);
        }
      };

      const deleteDream = (dreamId) => {
        if (window.confirm('确定要删除这个梦境记录吗？')) {
          setDreams(dreams.filter(dream => dream.id !== dreamId));
          if (dreams.length === 1) {
            localStorage.removeItem('dreams');
          }
        }
      };

      const toggleExpand = (dreamId) => {
        setExpandedDream(expandedDream === dreamId ? null : dreamId);
      };

      const formatDate = (dateString) => {
        const date = new Date(dateString);
        return date.toLocaleDateString('zh-CN', {
          year: 'numeric',
          month: 'long',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      };

      return (
        <div className="app">
          <header className="app-header">
            <h1 className="app-title">✨ 梦境解读</h1>
            <p className="app-subtitle">探索你的潜意识，发现内心的声音</p>
          </header>

          <main>
            <div className="card">
              <form className="dream-form">
                <div className="form-group">
                  <label className="form-label" htmlFor="api-key">
                    🔑 Anthropic API Key
                  </label>
                  <input
                    id="api-key"
                    type="password"
                    className="form-input"
                    value={apiKey}
                    onChange={(e) => setApiKey(e.target.value)}
                    placeholder="sk-ant-..."
                  />
                  <p className="api-key-hint">
                    你的 API Key 将安全地存储在浏览器本地，仅用于解读梦境
                  </p>
                </div>
              </form>
            </div>

            <div className="card">
              <form className="dream-form" onSubmit={handleSubmit}>
                <div className="form-group">
                  <label className="form-label" htmlFor="dream-title">
                    🌙 梦境标题
                  </label>
                  <input
                    id="dream-title"
                    type="text"
                    className="form-input"
                    value={dreamTitle}
                    onChange={(e) => setDreamTitle(e.target.value)}
                    placeholder="给你的梦境起个名字..."
                    maxLength={100}
                  />
                </div>

                <div className="form-group">
                  <label className="form-label" htmlFor="dream-content">
                    💭 梦境内容
                  </label>
                  <textarea
                    id="dream-content"
                    className="form-textarea"
                    value={dreamContent}
                    onChange={(e) => setDreamContent(e.target.value)}
                    placeholder="记录下你的梦境...尽可能详细地描述你梦中的场景、人物、情绪和感受"
                  />
                </div>

                <button type="submit" className="form-button">
                  <span>✨</span>
                  记录并解读梦境
                </button>
              </form>
            </div>

            {dreams.length > 0 && (
              <div className="card">
                <div className="dreams-container">
                  <div className="dreams-header">
                    <h2 className="dreams-title">
                      📖 我的梦境日记
                    </h2>
                    <span className="dreams-count">
                      共 {dreams.length} 个梦境
                    </span>
                  </div>

                  {dreams.map((dream) => (
                    <div key={dream.id} className="dream-item">
                      <div className="dream-header">
                        <div>
                          <h3 className="dream-title-text">{dream.title}</h3>
                          <p className="dream-date">{formatDate(dream.date)}</p>
                        </div>
                        <div className="dream-actions">
                          {!dream.interpretation && interpretingDream !== dream.id && (
                            <button
                              className="icon-button"
                              onClick={(e) => {
                                e.stopPropagation();
                                interpretDream(dream.id, dream.content);
                              }}
                              title="解读梦境"
                            >
                              ✨
                            </button>
                          )}
                          <button
                            className="icon-button delete"
                            onClick={(e) => {
                              e.stopPropagation();
                              deleteDream(dream.id);
                            }}
                            title="删除"
                          >
                            🗑️
                          </button>
                        </div>
                      </div>

                      <div
                        className={`dream-content ${expandedDream === dream.id ? 'expanded' : ''}`}
                        onClick={() => toggleExpand(dream.id)}
                      >
                        {dream.content}
                      </div>

                      {interpretingDream === dream.id && (
                        <div className="dream-interpretation">
                          <div className="interpretation-title">
                            <span className="loading-spinner"></span>
                            正在解读梦境...
                          </div>
                        </div>
                      )}

                      {dream.interpretation && (
                        <div className="dream-interpretation">
                          <div className="interpretation-title">
                            💫 解梦分析
                          </div>
                          <div className="interpretation-content">
                            {dream.interpretation}
                          </div>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {dreams.length === 0 && (
              <div className="card">
                <div className="empty-state">
                  <div className="empty-state-icon">🌌</div>
                  <p className="empty-state-text">
                    还没有记录梦境，开始记录你的第一个梦吧
                  </p>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
