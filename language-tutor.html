<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交互式语言学习导师</title>
    <link rel="stylesheet" href="language-tutor.css">
</head>
<body>
    <div class="app-container">
        <!-- 顶部导航栏 -->
        <header class="header">
            <h1>🌍 语言学习导师</h1>
            <div class="header-controls">
                <div class="language-selector">
                    <label for="target-language">学习语言:</label>
                    <select id="target-language">
                        <option value="es">🇪🇸 西班牙语</option>
                        <option value="fr">🇫🇷 法语</option>
                        <option value="de">🇩🇪 德语</option>
                        <option value="ja">🇯🇵 日语</option>
                        <option value="it">🇮🇹 意大利语</option>
                        <option value="pt">🇵🇹 葡萄牙语</option>
                        <option value="ru">🇷🇺 俄语</option>
                        <option value="ko">🇰🇷 韩语</option>
                    </select>
                </div>
                <div class="mode-toggle">
                    <label for="chat-mode">模式:</label>
                    <select id="chat-mode">
                        <option value="casual">休闲聊天</option>
                        <option value="structured">结构化课程</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- 主内容区域 -->
        <main class="main-content">
            <!-- 左侧：对话区域 -->
            <section class="chat-section">
                <div class="proficiency-indicator">
                    <div class="proficiency-header">
                        <span>当前水平:</span>
                        <span id="proficiency-level">初学者</span>
                    </div>
                    <div class="proficiency-bar">
                        <div id="proficiency-progress" class="proficiency-progress"></div>
                    </div>
                </div>

                <div id="chat-messages" class="chat-messages">
                    <div class="message bot-message">
                        <div class="message-content">
                            <strong>导师:</strong> 你好！我是你的语言学习导师。选择一门你想学习的语言，然后我们就可以开始对话了！
                        </div>
                    </div>
                </div>

                <div class="chat-input-container">
                    <textarea
                        id="user-input"
                        placeholder="输入你的消息..."
                        rows="3"
                    ></textarea>
                    <button id="send-btn" class="send-btn">
                        <span>发送</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                        </svg>
                    </button>
                </div>

                <div class="api-key-notice" id="api-key-notice">
                    <p>⚠️ 请先设置 Gemini API 密钥</p>
                    <input type="password" id="api-key-input" placeholder="输入你的 Gemini API Key">
                    <button id="save-api-key">保存</button>
                </div>
            </section>

            <!-- 右侧：反馈和目标面板 -->
            <aside class="sidebar">
                <!-- 实时反馈 -->
                <div class="panel feedback-panel">
                    <h3>📝 实时反馈</h3>
                    <div id="feedback-content" class="feedback-content">
                        <p class="placeholder-text">在这里将显示你的语法、词汇和句法反馈...</p>
                    </div>
                </div>

                <!-- 学习目标 -->
                <div class="panel goals-panel">
                    <h3>🎯 学习目标</h3>
                    <div id="goals-list" class="goals-list">
                        <div class="goal-item">
                            <input type="checkbox">
                            <span>识别熟练程度</span>
                        </div>
                    </div>
                    <div class="add-goal">
                        <input type="text" id="new-goal-input" placeholder="添加新目标...">
                        <button id="add-goal-btn">+</button>
                    </div>
                </div>

                <!-- 进度追踪 -->
                <div class="panel progress-panel">
                    <h3>📊 学习进度</h3>
                    <div class="progress-stats">
                        <div class="stat-item">
                            <span class="stat-label">词汇量:</span>
                            <span id="vocab-count" class="stat-value">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">对话时长:</span>
                            <span id="conversation-time" class="stat-value">0分钟</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">消息数:</span>
                            <span id="message-count" class="stat-value">0</span>
                        </div>
                    </div>
                    <canvas id="progress-chart" width="300" height="200"></canvas>
                </div>

                <!-- 学习日志 -->
                <div class="panel log-panel">
                    <h3>📚 学习日志</h3>
                    <div id="session-log" class="session-log">
                        <p class="placeholder-text">你的学习会话记录将显示在这里...</p>
                    </div>
                    <button id="clear-log-btn" class="secondary-btn">清除日志</button>
                </div>
            </aside>
        </main>
    </div>

    <script src="language-tutor.js"></script>
</body>
</html>
